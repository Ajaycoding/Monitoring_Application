# Minimal CI for the local demo — install deps and run unit tests.
# No deploy jobs; no custom secrets required.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the local demo Python version (3.10.x).
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest
        env:
          # Demo-safe test secret only; do not add production secrets here.
          SECRET_KEY: ci-test-secret
